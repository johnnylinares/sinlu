<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinlú - Inteligencia Eléctrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        
        :root {
            /* Tema por defecto (Con luz) */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #f59e0b;
            --border: #e2e8f0;
            --shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        body.sin-luz {
            --bg-color: #020617; /* Azul ultra oscuro casi negro */
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f97316; /* Naranja fuego */
            --border: #1e293b;
            --shadow: 0 20px 50px -10px rgba(249, 115, 22, 0.15);
        }

        .glass-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.8s ease;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 15px rgba(249,115,22,0.6)); }
            50% { opacity: 0.8; transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(249,115,22,0.2)); }
            75% { opacity: 0.9; transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(249,115,22,0.8)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); filter: drop-shadow(0 10px 15px rgba(245,158,11,0.2)); }
            50% { transform: translateY(-10px); filter: drop-shadow(0 20px 20px rgba(245,158,11,0.4)); }
        }

        .icono-vela { animation: flicker 2.5s ease-in-out infinite alternate; display: none; }
        .icono-foco { animation: float 4s ease-in-out infinite; display: inline-block; }
        
        body.sin-luz .icono-vela { display: inline-block; }
        body.sin-luz .icono-foco { display: none; }

        .timeline-line::before {
            content: ''; position: absolute; left: 15px; top: 0; bottom: 0;
            width: 2px; background-color: var(--border); z-index: 0;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <main class="w-full max-w-lg mx-auto flex flex-col gap-6">
        
        <!-- Tarjeta de Estado Actual -->
        <div class="glass-card rounded-3xl p-8 text-center relative overflow-hidden">
            <div class="text-7xl mb-4">
                <span class="icono-foco">💡</span>
                <span class="icono-vela">🕯️</span>
            </div>
            
            <h1 id="titulo-estado" class="text-5xl font-black tracking-tight mb-2">Conlú</h1>
            <p id="reloj-actual" class="text-lg text-[var(--text-muted)] font-medium mb-6">--:--:--</p>

            <!-- Panel Predictivo (Solo visible sin luz) -->
            <div id="panel-prediccion" class="hidden bg-opacity-10 bg-[var(--accent)] border border-[var(--accent)] border-opacity-20 rounded-2xl p-4 mt-4">
                <p class="text-sm uppercase tracking-wider font-bold text-[var(--accent)] mb-1">Algoritmo Predictivo</p>
                <div class="flex items-center justify-center gap-2">
                    <svg class="w-5 h-5 text-[var(--accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="font-medium text-[var(--text-main)]">Regreso estimado: <span id="hora-estimada" class="font-bold">Calculando...</span></span>
                </div>
                <p id="texto-promedio" class="text-xs text-[var(--text-muted)] mt-2 mt-1"></p>
            </div>
        </div>

        <!-- Tarjeta de Historial -->
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <h2 class="text-xl font-bold flex items-center gap-2 mb-6 border-b border-[var(--border)] pb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Análisis de Cortes
            </h2>
            
            <div id="timeline-container" class="relative timeline-line flex flex-col gap-6">
                <p class="text-center text-sm text-[var(--text-muted)] italic py-4 relative z-10 bg-[var(--card-bg)]">Cargando datos del sensor...</p>
            </div>
        </div>
    </main>

    <script>
        // Formateador de fechas para Venezuela
        const tz = { timeZone: 'America/Caracas' };
        
        // Reloj en tiempo real
        setInterval(() => {
            const timeStr = new Date().toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit', second:'2-digit' });
            document.getElementById('reloj-actual').innerText = `${timeStr} (VE)`;
        }, 1000);

        // Convierte milisegundos a texto legible (ej: "3h 15m")
        function msToText(ms) {
            if (!ms || ms < 60000) return "< 1 min";
            let mins = Math.floor((ms / (1000 * 60)) % 60);
            let hrs = Math.floor((ms / (1000 * 60 * 60)));
            if (hrs > 0) return `${hrs}h ${mins}m`;
            return `${mins}m`;
        }

        async function sincronizarCerebro() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const isLuz = data.actual.luz;
                document.body.className = isLuz ? '' : 'sin-luz';
                document.getElementById('titulo-estado').innerText = isLuz ? 'Conlú' : 'Sinlú';

                const panelPred = document.getElementById('panel-prediccion');
                
                // Lógica del algoritmo de predicción
                if (!isLuz) {
                    panelPred.classList.remove('hidden');
                    
                    // Si tenemos datos suficientes para predecir
                    if (data.estadisticas.promedioMs > 0) {
                        const tiempoCorte = new Date(data.actual.timestamp).getTime();
                        const tiempoEstimadoRegreso = new Date(tiempoCorte + data.estadisticas.promedioMs);
                        
                        const horaRegresoStr = tiempoEstimadoRegreso.toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
                        
                        document.getElementById('hora-estimada').innerText = horaRegresoStr;
                        document.getElementById('texto-promedio').innerText = `Basado en el promedio histórico de ${msToText(data.estadisticas.promedioMs)} (${data.estadisticas.totalCortes} cortes analizados).`;
                    } else {
                        document.getElementById('hora-estimada').innerText = 'Sin historial';
                        document.getElementById('texto-promedio').innerText = 'Necesito al menos 1 corte para aprender.';
                    }
                } else {
                    panelPred.classList.add('hidden');
                }

                const timeline = document.getElementById('timeline-container');
                timeline.innerHTML = '';

                if (data.historial.length === 0) {
                    timeline.innerHTML = '<p class="text-center text-sm text-[var(--text-muted)] italic py-4 relative z-10 bg-[var(--card-bg)]">Aún no hay cortes registrados en la base de datos.</p>';
                    return;
                }

                // Generar tarjetas de historial
                data.historial.forEach((evento, index) => {
                    const esCorteActual = !evento.regreso;
                    
                    const fechaCorte = new Date(evento.corte);
                    const diaCorte = fechaCorte.toLocaleDateString('es-VE', { ...tz, weekday: 'short', day: 'numeric', month: 'short' });
                    const horaCorte = fechaCorte.toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
                    
                    let estadoStr, duracionStr, colorPunto;
                    
                    if (esCorteActual) {
                        estadoStr = "En curso...";
                        const duracionHastaAhora = new Date().getTime() - fechaCorte.getTime();
                        duracionStr = msToText(duracionHastaAhora);
                        colorPunto = 'bg-orange-500 shadow-[0_0_10px_rgba(249,115,22,0.8)]';
                    } else {
                        const horaRegreso = new Date(evento.regreso).toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
                        estadoStr = `Volvió a las ${horaRegreso}`;
                        duracionStr = msToText(evento.duracionMs);
                        colorPunto = 'bg-gray-400 border-2 border-[var(--card-bg)]';
                    }

                    const htmlCard = `
                    <div class="relative pl-10 z-10 pb-2">
                        <!-- Punto en la línea -->
                        <div class="absolute left-[11px] top-2 w-2.5 h-2.5 rounded-full ${colorPunto} z-20"></div>
                        
                        <!-- Contenido -->
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-[var(--card-bg)] border border-[var(--border)] rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
                            <div>
                                <div class="text-sm font-bold capitalize text-[var(--text-main)]">${diaCorte} <span class="text-[var(--text-muted)] font-normal text-xs ml-2">Corte: ${horaCorte}</span></div>
                                <div class="text-sm mt-1 flex items-center gap-1 ${esCorteActual ? 'text-orange-500 font-medium' : 'text-[var(--text-muted)]'}">
                                    ${esCorteActual ? '<span class="animate-pulse">🕯️</span>' : '💡'} ${estadoStr}
                                </div>
                            </div>
                            <div class="mt-3 sm:mt-0 bg-opacity-10 bg-[var(--text-main)] px-3 py-1.5 rounded-lg text-sm font-semibold whitespace-nowrap text-right">
                                ⏱️ ${duracionStr}
                            </div>
                        </div>
                    </div>`;
                    
                    timeline.insertAdjacentHTML('beforeend', htmlCard);
                });

            } catch (e) {
                console.error("Error contactando al cerebro", e);
            }
        }
        
        // Sincronizar cada 5 segundos
        setInterval(sincronizarCerebro, 5000);
        sincronizarCerebro();
    </script>
</body>
</html>
