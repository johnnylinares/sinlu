<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinlú - Monitor Eléctrico</title>
    <style>
        :root {
            --bg-conlu: linear-gradient(135deg, #ffffff 0%, #fff9c4 100%);
            --card-conlu: rgba(255, 255, 255, 0.7);
            --text-conlu: #f57f17;
            
            --bg-sinlu: linear-gradient(135deg, #020617 0%, #0c4a6e 100%);
            --card-sinlu: rgba(15, 23, 42, 0.7);
            --text-sinlu: #38bdf8;
        }
        body {
            margin: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 1s ease, color 1s ease;
            text-align: center;
        }
        body.conlu { background: var(--bg-conlu); color: #334155; }
        body.sinlu { background: var(--bg-sinlu); color: #f8fafc; }

        .card {
            padding: 3rem 4rem; border-radius: 2rem;
            transition: all 0.5s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        body.conlu .card { background: var(--card-conlu); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 40px rgba(250, 204, 21, 0.3); }
        body.sinlu .card { background: var(--card-sinlu); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 40px rgba(2, 132, 199, 0.4); }

        h1 { font-size: 4.5rem; margin: 0; letter-spacing: -1px; transition: color 0.5s ease; }
        body.conlu h1 { color: var(--text-conlu); }
        body.sinlu h1 { color: var(--text-sinlu); }

        .reloj { font-size: 1.5rem; margin-top: 10px; font-weight: 500; opacity: 0.8; }
        
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        .icon { font-size: 6rem; display: block; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }

        .historial { margin-top: 2rem; text-align: left; background: rgba(0,0,0,0.05); padding: 1.5rem; border-radius: 1.5rem; width: 100%; max-width: 300px; }
        body.sinlu .historial { background: rgba(255,255,255,0.05); }
        .historial h3 { margin-top: 0; font-size: 1rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .historial ul { list-style: none; padding: 0; margin: 0; font-size: 0.95rem; }
        .historial li { padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .historial li:last-child { border: none; }
    </style>
</head>
<body class="conlu" id="app-body">
    <div class="card">
        <span class="icon" id="icono">💡</span>
        <h1 id="titulo">Conlú</h1>
        <div class="reloj" id="reloj">Cargando hora...</div>
    </div>
    
    <div class="historial">
        <h3>Últimos Eventos (Nube)</h3>
        <ul id="lista-eventos"></ul>
    </div>

    <script>
        // Reloj en tiempo real (Hora Venezuela)
        setInterval(() => {
            const options = { timeZone: 'America/Caracas', hour12: true, hour: '2-digit', minute:'2-digit', second:'2-digit' };
            document.getElementById('reloj').innerText = new Date().toLocaleTimeString('es-VE', options) + " (VE)";
        }, 1000);

        async function actualizarEstado() {
            try {
                // Llama a la Serverless Function de Vercel
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const body = document.getElementById('app-body');
                const titulo = document.getElementById('titulo');
                const icono = document.getElementById('icono');
                
                if (data.actual.luz) {
                    body.className = 'conlu';
                    titulo.innerText = 'Conlú';
                    icono.innerText = '💡';
                } else {
                    body.className = 'sinlu';
                    titulo.innerText = 'Sinlú';
                    icono.innerText = '🔌';
                }

                const lista = document.getElementById('lista-eventos');
                lista.innerHTML = '';
                if (data.historial.length === 0) lista.innerHTML = '<li>Sin registros aún</li>';
                data.historial.forEach(evento => {
                    const date = new Date(evento.timestamp).toLocaleTimeString('es-VE', {timeZone: 'America/Caracas', hour: '2-digit', minute:'2-digit'});
                    const li = document.createElement('li');
                    li.innerText = `${evento.luz ? '💡 Llegó' : '🔌 Se fue'} - ${date}`;
                    lista.appendChild(li);
                });
            } catch (e) {
                console.error("Error conectando con la API");
            }
        }
        
        setInterval(actualizarEstado, 3000);
        actualizarEstado();
    </script>
</body>
</html>
