<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinlú - Monitoreo Eléctrico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #f59e0b;
            --border: #e2e8f0;
            --shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
            --pill-bg: #1e293b;
            --pill-text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.5s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.sin-luz {
            --bg-color: #020617; 
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f97316; 
            --border: #1e293b;
            --shadow: 0 20px 50px -10px rgba(249, 115, 22, 0.15);
            --pill-bg: #f8fafc;
            --pill-text: #0f172a;
        }

        .glass-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all 0.5s ease;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 15px rgba(249,115,22,0.6)); }
            50% { opacity: 0.8; transform: scale(0.95); filter: drop-shadow(0 0 5px rgba(249,115,22,0.2)); }
            75% { opacity: 0.9; transform: scale(1.02); filter: drop-shadow(0 0 20px rgba(249,115,22,0.8)); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); filter: drop-shadow(0 10px 15px rgba(245,158,11,0.2)); }
            50% { transform: translateY(-10px); filter: drop-shadow(0 20px 20px rgba(245,158,11,0.4)); }
        }

        .icono-vela { animation: flicker 2.5s ease-in-out infinite alternate; display: none; }
        .icono-foco { animation: float 4s ease-in-out infinite; display: inline-block; }
        
        body.sin-luz .icono-vela { display: inline-block; }
        body.sin-luz .icono-foco { display: none; }

        .timeline-line::before {
            content: ''; position: absolute; left: 15px; top: 0; bottom: 0;
            width: 2px; background-color: var(--border); z-index: 0;
        }

        /* Utilidades para la SPA */
        .page-view { display: none; animation: fadeIn 0.4s ease forwards; }
        .page-view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Menú lateral */
        #mobile-menu { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #mobile-menu.open { transform: translateX(0); }
    </style>
</head>
<body class="flex flex-col items-center">

    <header class="w-full glass-card sticky top-0 z-50 px-6 py-4 flex justify-between items-center rounded-b-2xl border-t-0">
        <div class="flex items-center gap-2 font-black text-xl tracking-tight">
            <span class="text-[var(--accent)]">⚡</span> Sinlú
        </div>
        
        <!-- Botón Menú Hamburguesa -->
        <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-black hover:bg-opacity-5 focus:outline-none">
            <svg class="w-6 h-6 text-[var(--text-main)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
    </header>

    <!-- Overlay y Menú Lateral -->
    <div id="menu-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>
    <nav id="mobile-menu" class="fixed right-0 top-0 bottom-0 w-64 glass-card z-50 p-6 flex flex-col gap-4 shadow-2xl">
        <div class="flex justify-end">
            <button onclick="toggleMenu()" class="p-2 text-[var(--text-muted)] hover:text-[var(--text-main)]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="text-xs uppercase font-bold text-[var(--text-muted)] tracking-wider mb-2">Navegación</div>
        <button onclick="switchPage('home')" class="text-left font-semibold text-lg flex items-center gap-3 p-3 rounded-xl hover:bg-black hover:bg-opacity-5 transition">
            🏠 Panel Principal
        </button>
        <button onclick="switchPage('history')" class="text-left font-semibold text-lg flex items-center gap-3 p-3 rounded-xl hover:bg-black hover:bg-opacity-5 transition">
            📅 Historial Completo
        </button>
    </nav>

    <main id="home" class="page-view active w-full max-w-lg mx-auto flex-col gap-6 p-4 md:p-8">
        
        <!-- Tarjeta de Estado Actual -->
        <div class="glass-card rounded-3xl p-8 text-center relative overflow-hidden">
            <div class="text-7xl mb-4">
                <span class="icono-foco">💡</span>
                <span class="icono-vela">🕯️</span>
            </div>
            
            <h1 id="titulo-estado" class="text-5xl font-black tracking-tight mb-2">Conlú</h1>
            <p id="reloj-actual" class="text-lg text-[var(--text-muted)] font-medium mb-6">--:--:--</p>

            <!-- Panel Predictivo / Estadísticas -->
            <div id="panel-prediccion" class="bg-opacity-10 border border-opacity-20 rounded-2xl p-4 mt-4 transition-colors">
                <p class="text-sm uppercase tracking-wider font-bold mb-1" id="pred-titulo">Cargando datos...</p>
                
                <!-- Modo Sin Luz: Muestra cuenta regresiva -->
                <div id="pred-activa" class="hidden flex-col items-center justify-center gap-1">
                    <span class="font-medium text-[var(--text-main)] flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Regreso estimado: <span id="hora-estimada" class="font-bold text-xl">--:--</span>
                    </span>
                </div>

                <!-- Siempre visible: Promedio general -->
                <p id="texto-promedio" class="text-sm text-[var(--text-muted)] mt-2 font-medium"></p>
            </div>
        </div>

        <!-- Tarjeta de Últimos Registros (Solo 3) -->
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 border-b border-[var(--border)] pb-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Últimos Cortes
                </h2>
                <button onclick="switchPage('history')" class="text-sm font-semibold text-[var(--accent)] hover:underline">Ver todos &rarr;</button>
            </div>
            
            <div id="recent-timeline" class="relative timeline-line flex flex-col gap-6">
                <!-- Se inyecta por JS -->
            </div>
        </div>
    </main>

    <main id="history" class="page-view w-full max-w-lg mx-auto flex-col gap-6 p-4 md:p-8">
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <h2 class="text-2xl font-black mb-2">Historial de Cortes</h2>
            <p class="text-[var(--text-muted)] mb-6 pb-4 border-b border-[var(--border)]">Registro completo de las fluctuaciones eléctricas detectadas por el sistema.</p>
            
            <div id="full-timeline" class="relative timeline-line flex flex-col gap-6">
                <!-- Se inyecta por JS -->
            </div>
        </div>
    </main>

    <script>
        // --- NAVEGACIÓN Y MENÚ ---
        let menuOpen = false;
        function toggleMenu() {
            menuOpen = !menuOpen;
            document.getElementById('mobile-menu').classList.toggle('open', menuOpen);
            
            const overlay = document.getElementById('menu-overlay');
            if(menuOpen) {
                overlay.classList.remove('hidden');
            } else {
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(menuOpen) toggleMenu();
            window.scrollTo(0,0);
        }

        // --- RELOJ Y UTILIDADES ---
        const tz = { timeZone: 'America/Caracas' };
        
        setInterval(() => {
            const timeStr = new Date().toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit', second:'2-digit' });
            document.getElementById('reloj-actual').innerText = `${timeStr} (VE)`;
        }, 1000);

        function msToText(ms) {
            if (!ms || ms < 60000) return "< 1 min";
            let mins = Math.floor((ms / (1000 * 60)) % 60);
            let hrs = Math.floor((ms / (1000 * 60 * 60)));
            if (hrs > 0) return `${hrs}h ${mins}m`;
            return `${mins}m`;
        }

        // --- RENDERIZADO DE TARJETAS (Mejorado) ---
        function generarHTMLTarjeta(evento, esCorteActual) {
            const fechaCorte = new Date(evento.corte);
            const diaCorte = fechaCorte.toLocaleDateString('es-VE', { ...tz, weekday: 'short', day: 'numeric', month: 'short' });
            const horaCorte = fechaCorte.toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
            
            let colorPunto, infoLlegada, duracionStr;

            if (esCorteActual) {
                colorPunto = 'bg-orange-500 shadow-[0_0_10px_rgba(249,115,22,0.8)]';
                infoLlegada = `<span class="text-orange-500 font-semibold animate-pulse">En curso...</span>`;
                const duracionHastaAhora = new Date().getTime() - fechaCorte.getTime();
                duracionStr = msToText(duracionHastaAhora);
            } else {
                colorPunto = 'bg-gray-400 border-2 border-[var(--card-bg)]';
                const horaRegreso = new Date(evento.regreso).toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
                infoLlegada = `<span class="text-[var(--text-main)]">🟢 Volvió: <b>${horaRegreso}</b></span>`;
                duracionStr = msToText(evento.duracionMs);
            }

            // Nueva estructura de tarjeta ultra-clara
            return `
            <div class="relative pl-10 z-10 pb-2">
                <div class="absolute left-[11px] top-4 w-2.5 h-2.5 rounded-full ${colorPunto} z-20"></div>
                
                <div class="bg-[var(--card-bg)] border border-[var(--border)] rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
                    
                    <!-- Fecha Superior -->
                    <div class="flex justify-between items-start mb-3">
                        <div class="text-sm font-black uppercase text-[var(--text-muted)] tracking-wider">${diaCorte}</div>
                        <!-- Etiqueta de duración (Colores arreglados) -->
                        <div class="bg-[var(--pill-bg)] text-[var(--pill-text)] px-3 py-1 rounded-full text-xs font-bold shadow-inner">
                            ⏱️ ${duracionStr}
                        </div>
                    </div>
                    
                    <!-- Detalles del corte -->
                    <div class="flex flex-col gap-2 text-sm mt-2">
                        <div class="flex items-center gap-2">
                            <span class="text-[var(--text-main)]">🔴 Se fue: <b>${horaCorte}</b></span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${infoLlegada}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- CEREBRO PRINCIPAL ---
        async function sincronizarCerebro() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                // 1. Aplicar estado visual
                const isLuz = data.actual.luz;
                document.body.className = isLuz ? '' : 'sin-luz';
                document.getElementById('titulo-estado').innerText = isLuz ? 'Conlú' : 'Sinlú';

                // 2. Panel Predictivo
                const panel = document.getElementById('panel-prediccion');
                const predTitulo = document.getElementById('pred-titulo');
                const predActiva = document.getElementById('pred-activa');
                const textoPromedio = document.getElementById('texto-promedio');

                if (data.estadisticas.promedioMs > 0) {
                    const textoPromedioSt = `Promedio histórico: ${msToText(data.estadisticas.promedioMs)} (${data.estadisticas.totalCortes} cortes)`;
                    textoPromedio.innerText = textoPromedioSt;

                    if (!isLuz) {
                        // MODO SIN LUZ: Mostrar cuenta regresiva de la predicción
                        panel.className = "bg-[var(--accent)] bg-opacity-20 border border-[var(--accent)] rounded-2xl p-4 mt-4 transition-colors text-[var(--accent)]";
                        predTitulo.innerText = "Algoritmo Predictivo Activo";
                        predTitulo.className = "text-sm uppercase tracking-wider font-bold mb-2 text-[var(--accent)]";
                        predActiva.classList.remove('hidden');
                        
                        // Calcular hora de regreso
                        const tiempoCorte = new Date(data.actual.timestamp).getTime();
                        const tiempoEstimadoRegreso = new Date(tiempoCorte + data.estadisticas.promedioMs);
                        document.getElementById('hora-estimada').innerText = tiempoEstimadoRegreso.toLocaleTimeString('es-VE', { ...tz, hour: '2-digit', minute:'2-digit' });
                        
                    } else {
                        // MODO CON LUZ: Solo mostrar estadísticas tranquilas
                        panel.className = "bg-[var(--text-main)] bg-opacity-5 border border-[var(--border)] rounded-2xl p-4 mt-4 transition-colors";
                        predTitulo.innerText = "Estadísticas del Sistema";
                        predTitulo.className = "text-sm uppercase tracking-wider font-bold mb-1 text-[var(--text-muted)]";
                        predActiva.classList.add('hidden');
                    }
                } else {
                    textoPromedio.innerText = "Esperando más cortes para aprender y predecir.";
                    predActiva.classList.add('hidden');
                }

                // 3. Renderizar Líneas de Tiempo
                const recentContainer = document.getElementById('recent-timeline');
                const fullContainer = document.getElementById('full-timeline');
                
                recentContainer.innerHTML = '';
                fullContainer.innerHTML = '';

                if (data.historial.length === 0) {
                    const vacio = '<p class="text-center text-sm text-[var(--text-muted)] italic py-4">Aún no hay registros en la base de datos.</p>';
                    recentContainer.innerHTML = vacio;
                    fullContainer.innerHTML = vacio;
                    return;
                }

                // Inyectar Historial Completo
                data.historial.forEach((evento, index) => {
                    const esCorteActual = !evento.regreso;
                    const html = generarHTMLTarjeta(evento, esCorteActual);
                    fullContainer.insertAdjacentHTML('beforeend', html);
                    
                    // Inyectar solo los 3 primeros en el panel principal
                    if (index < 3) {
                        recentContainer.insertAdjacentHTML('beforeend', html);
                    }
                });

            } catch (e) {
                console.error("Error contactando al cerebro", e);
            }
        }
        
        // Sincronizar cada 5 segundos
        setInterval(sincronizarCerebro, 5000);
        sincronizarCerebro();
    </script>
</body>
</html>
